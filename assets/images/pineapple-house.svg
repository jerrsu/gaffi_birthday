<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="100%" height="100%">
  <!-- SpongeBob's Pineapple House -->
  <defs>
    <filter id="p-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Green Palm Leaves on Top -->
  <g fill="#2ECC71" stroke="#196F3D" stroke-width="2">
    <!-- Center top leaf -->
    <path d="M 100 80 C 95 40, 92 10, 100 2 C 108 10, 105 40, 100 80 Z"/>
    <!-- Left leaves -->
    <path d="M 95 80 C 80 45, 60 20, 45 22 C 48 35, 75 55, 95 80 Z"/>
    <path d="M 90 85 C 65 60, 35 45, 20 55 C 28 68, 60 75, 90 85 Z"/>
    <!-- Right leaves -->
    <path d="M 105 80 C 120 45, 140 20, 155 22 C 152 35, 125 55, 105 80 Z"/>
    <path d="M 110 85 C 135 60, 165 45, 180 55 C 172 68, 140 75, 110 85 Z"/>
  </g>

  <!-- Pineapple Fruit Body -->
  <ellipse cx="100" cy="155" rx="72" ry="85" fill="#FF8C00" stroke="#000" stroke-width="3" filter="url(#p-shadow)"/>

  <!-- Pineapple Crosshatch Lines (Geometric texture) -->
  <g stroke="#D35400" stroke-width="2.5" opacity="0.75">
    <path d="M 50 110 L 150 200"/>
    <path d="M 38 135 L 140 225"/>
    <path d="M 34 165 L 115 238"/>
    <path d="M 70 95 L 162 175"/>

    <path d="M 150 110 L 50 200"/>
    <path d="M 162 135 L 60 225"/>
    <path d="M 166 165 L 85 238"/>
    <path d="M 130 95 L 38 175"/>
  </g>

  <!-- Chimney Pipe -->
  <path d="M 148 115 L 175 105 L 175 92 L 185 90 L 180 120 L 152 130 Z" fill="#7F8C8D" stroke="#000" stroke-width="2"/>

  <!-- Round Porthole Windows -->
  <!-- Upper Left Window -->
  <circle cx="70" cy="130" r="15" fill="#3498DB" stroke="#95A5A6" stroke-width="5"/>
  <circle cx="70" cy="130" r="15" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="70" cy="130" r="18" fill="none" stroke="#7F8C8D" stroke-width="1.5"/>
  <!-- Rivets -->
  <circle cx="68" cy="113" r="1.5" fill="#333"/>
  <circle cx="87" cy="130" r="1.5" fill="#333"/>
  <circle cx="68" cy="147" r="1.5" fill="#333"/>
  <circle cx="53" cy="130" r="1.5" fill="#333"/>
  <!-- Window Glare -->
  <path d="M 64 122 Q 72 120 76 126" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Door (Metal Porthole Door with Wheel) -->
  <path d="M 82 238 L 82 195 C 82 185, 118 185, 118 195 L 118 238 Z" fill="#95A5A6" stroke="#000" stroke-width="2.5"/>
  <!-- Wheel Handle -->
  <circle cx="100" cy="210" r="8" fill="none" stroke="#2C3E50" stroke-width="2.5"/>
  <line x1="100" y1="202" x2="100" y2="218" stroke="#2C3E50" stroke-width="2"/>
  <line x1="92" y1="210" x2="108" y2="210" stroke="#2C3E50" stroke-width="2"/>
  <!-- Door Step / Sand Mound -->
  <path d="M 70 238 Q 100 234 130 238 Z" fill="#F1C40F"/>
</svg>
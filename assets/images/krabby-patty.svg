  <!-- Sesame seeds -->
  <ellipse cx="55" cy="45" rx="2.5" ry="1.5" fill="#FFF8DC" transform="rotate(-15 55 45)"/>
  <ellipse cx="80" cy="38" rx="2.5" ry="1.5" fill="#FFF8DC"/>
  <ellipse cx="105" cy="45" rx="2.5" ry="1.5" fill="#FFF8DC" transform="rotate(15 105 45)"/>
  <ellipse cx="68" cy="52" rx="2.5" ry="1.5" fill="#FFF8DC" transform="rotate(20 68 52)"/>
  <ellipse cx="92" cy="52" rx="2.5" ry="1.5" fill="#FFF8DC" transform="rotate(-10 92 52)"/>

  <!-- Lettuce (Wavy green) -->
  <path d="M 20 67 Q 35 73 50 67 Q 65 73 80 67 Q 95 73 110 67 Q 125 73 140 67 L 138 73 Q 125 78 110 73 Q 95 78 80 73 Q 65 78 50 73 Q 35 78 22 73 Z" fill="#2ECC71" stroke="#1E8449" stroke-width="1.5"/>


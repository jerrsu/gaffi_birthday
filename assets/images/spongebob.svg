<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="cute-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="sponge-grad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF97A"/>
      <stop offset="60%" stop-color="#FFEA29"/>
      <stop offset="100%" stop-color="#F5C700"/>
    </radialGradient>
    <radialGradient id="eye-blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#72D6FC"/>
      <stop offset="65%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#034674"/>
    </radialGradient>
    <linearGradient id="party-hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
  </defs>

  <!-- Left Arm (Joyful Excited Wave) -->
  <g>
    <!-- Arm -->
    <path d="M 46 148 C 22 135, 12 105, 20 85 C 22 80, 30 82, 28 87 C 22 104, 30 128, 50 138 Z" 
          fill="#FFE833" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <!-- Cute Hand -->
    <circle cx="22" cy="84" r="10" fill="#FFE833" stroke="#2B1500" stroke-width="2.5"/>
    <circle cx="15" cy="78" r="5" fill="#FFE833" stroke="#2B1500" stroke-width="2"/>
    <circle cx="20" cy="71" r="5" fill="#FFE833" stroke="#2B1500" stroke-width="2"/>
    <circle cx="28" cy="74" r="5" fill="#FFE833" stroke="#2B1500" stroke-width="2"/>
  </g>

  <!-- Right Arm (Excited Waving) -->
  <g>
    <!-- Arm -->
    <path d="M 174 148 C 198 135, 208 105, 200 85 C 198 80, 190 82, 192 87 C 198 104, 190 128, 170 138 Z" 
          fill="#FFE833" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <!-- Cute Hand -->
    <circle cx="198" cy="84" r="10" fill="#FFE833" stroke="#2B1500" stroke-width="2.5"/>
    <circle cx="205" cy="78" r="5" fill="#FFE833" stroke="#2B1500" stroke-width="2"/>
    <circle cx="200" cy="71" r="5" fill="#FFE833" stroke="#2B1500" stroke-width="2"/>
    <circle cx="192" cy="74" r="5" fill="#FFE833" stroke="#2B1500" stroke-width="2"/>
  </g>

  <!-- Legs & Shoes -->
  <g>
    <!-- Left Leg -->
    <rect x="80" y="206" width="9" height="24" fill="#FFE833" stroke="#2B1500" stroke-width="2.5"/>
    <!-- Sock -->
    <rect x="79" y="222" width="11" height="13" fill="#FFFFFF" stroke="#2B1500" stroke-width="2"/>
    <line x1="79" y1="226" x2="90" y2="226" stroke="#0099FF" stroke-width="2"/>
    <line x1="79" y1="230" x2="90" y2="230" stroke="#FF2233" stroke-width="2"/>
    <!-- Shoe -->
    <path d="M 72 236 C 75 231, 91 230, 93 238 C 95 247, 63 251, 63 243 C 63 237, 69 236, 72 236 Z" 
          fill="#1A1A1A" stroke="#000" stroke-width="2.5"/>
    <!-- Shoe shine -->
    <ellipse cx="82" cy="237" rx="3" ry="1.8" fill="#FFF" opacity="0.8"/>

    <!-- Right Leg -->
    <rect x="131" y="206" width="9" height="24" fill="#FFE833" stroke="#2B1500" stroke-width="2.5"/>
    <!-- Sock -->
    <rect x="130" y="222" width="11" height="13" fill="#FFFFFF" stroke="#2B1500" stroke-width="2"/>
    <line x1="130" y1="226" x2="141" y2="226" stroke="#0099FF" stroke-width="2"/>
    <line x1="130" y1="230" x2="141" y2="230" stroke="#FF2233" stroke-width="2"/>
    <!-- Shoe -->
    <path d="M 130 238 C 131 230, 147 231, 150 236 C 153 236, 159 237, 159 243 C 159 251, 127 247, 129 238 Z" 
          fill="#1A1A1A" stroke="#000" stroke-width="2.5"/>
    <!-- Shoe shine -->
    <ellipse cx="140" cy="237" rx="3" ry="1.8" fill="#FFF" opacity="0.8"/>
  </g>

  <!-- Pants (Brown) -->
  <g>
    <path d="M 52 182 L 168 182 L 164 207 L 56 207 Z" fill="#8B5A2B" stroke="#2B1500" stroke-width="3"/>
    <!-- Pant legs cuffs -->
    <rect x="74" y="204" width="21" height="8" fill="#8B5A2B" stroke="#2B1500" stroke-width="2.5" rx="2"/>
    <rect x="125" y="204" width="21" height="8" fill="#8B5A2B" stroke="#2B1500" stroke-width="2.5" rx="2"/>
    <!-- Belt loops (Black dashes) -->
    <rect x="65" y="186" width="14" height="4.5" fill="#2B1500" rx="1.5"/>
    <rect x="92" y="186" width="14" height="4.5" fill="#2B1500" rx="1.5"/>
    <rect x="115" y="186" width="14" height="4.5" fill="#2B1500" rx="1.5"/>
    <rect x="141" y="186" width="14" height="4.5" fill="#2B1500" rx="1.5"/>
  </g>

  <!-- Shirt (White) -->
  <g>
    <path d="M 51 162 L 169 162 L 168 183 L 52 183 Z" fill="#FFFFFF" stroke="#2B1500" stroke-width="3"/>
    <!-- Shirt sleeves -->
    <path d="M 43 145 L 54 145 L 51 163 L 40 159 Z" fill="#FFF" stroke="#2B1500" stroke-width="2.5" rx="1"/>
    <path d="M 177 145 L 166 145 L 169 163 L 180 159 Z" fill="#FFF" stroke="#2B1500" stroke-width="2.5" rx="1"/>
    <!-- Collar triangles -->
    <polygon points="88,162 100,174 105,162" fill="#FFFFFF" stroke="#2B1500" stroke-width="2.2"/>
    <polygon points="132,162 120,174 115,162" fill="#FFFFFF" stroke="#2B1500" stroke-width="2.2"/>
    <!-- Cute Red Tie -->
    <polygon points="106,165 114,165 117,175 110,177 103,175" fill="#FF1E38" stroke="#2B1500" stroke-width="2"/>
    <polygon points="107,176 113,176 117,196 110,201 103,196" fill="#FF1E38" stroke="#2B1500" stroke-width="2"/>
  </g>

  <!-- Sponge Body (Curvy, Squishy, Cute) -->
  <path d="M 50 48 
           Q 46 72 50 96 
           Q 46 120 50 144 
           Q 47 155 51 163 
           L 169 163 
           Q 173 155 170 144 
           Q 174 120 170 96 
           Q 174 72 170 48 
           Q 140 43 110 46 
           Q 80 43 50 48 Z" 
        fill="url(#sponge-grad)" stroke="#2B1500" stroke-width="3.5" filter="url(#cute-shadow)"/>

  <!-- Cute Olive Sponge Pores / Freckles -->
  <g fill="#A89205" opacity="0.6">
    <ellipse cx="64" cy="62" rx="7" ry="8"/>
    <ellipse cx="58" cy="116" rx="8" ry="9"/>
    <ellipse cx="68" cy="148" rx="6" ry="6"/>
    <ellipse cx="156" cy="65" rx="7" ry="7"/>
    <ellipse cx="162" cy="120" rx="8" ry="9"/>
    <ellipse cx="152" cy="149" rx="6" ry="7"/>
    <ellipse cx="78" cy="53" rx="4" ry="4"/>
    <ellipse cx="142" cy="52" rx="5" ry="4"/>
  </g>

  <!-- Blushing Cheeks (Super Cute Pink Rosy Glow) -->
  <g>
    <!-- Left Cheek -->
    <ellipse cx="71" cy="114" rx="12" ry="9" fill="#FF8EA6" opacity="0.85"/>
    <path d="M 64 120 C 60 106, 76 102, 83 112" fill="none" stroke="#2B1500" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Freckles on cheek -->
    <circle cx="68" cy="111" r="1.5" fill="#D32F2F"/>
    <circle cx="73" cy="108" r="1.5" fill="#D32F2F"/>
    <circle cx="76" cy="113" r="1.5" fill="#D32F2F"/>

    <!-- Right Cheek -->
    <ellipse cx="149" cy="114" rx="12" ry="9" fill="#FF8EA6" opacity="0.85"/>
    <path d="M 156 120 C 160 106, 144 102, 137 112" fill="none" stroke="#2B1500" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Freckles on cheek -->
    <circle cx="144" cy="113" r="1.5" fill="#D32F2F"/>
    <circle cx="147" cy="108" r="1.5" fill="#D32F2F"/>
    <circle cx="152" cy="111" r="1.5" fill="#D32F2F"/>
  </g>

  <!-- Super Joyful Smile, Tongue & Cute Buck Teeth -->
  <g>
    <!-- Big Mouth Cavity -->
    <path d="M 68 116 C 75 158, 145 158, 152 116 C 110 128, 110 128, 68 116 Z" 
          fill="#5C000B" stroke="#2B1500" stroke-width="3.2"/>
    <!-- Pink Bubbly Tongue -->
    <path d="M 88 144 C 95 132, 125 132, 132 144 C 122 153, 98 153, 88 144 Z" fill="#FF7388"/>
    <path d="M 110 136 L 110 148" stroke="#E63956" stroke-width="2" stroke-linecap="round"/>
    <!-- Two Cute Buck Teeth -->
    <rect x="94" y="119" width="13" height="14" fill="#FFFFFF" stroke="#2B1500" stroke-width="2.5" rx="1.5"/>
    <rect x="113" y="119" width="13" height="14" fill="#FFFFFF" stroke="#2B1500" stroke-width="2.5" rx="1.5"/>
    <!-- Cute Lip Curvature -->
    <path d="M 66 114 Q 72 122 78 118" fill="none" stroke="#2B1500" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 154 114 Q 148 122 142 118" fill="none" stroke="#2B1500" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Cute Round Nose -->
  <path d="M 106 100 C 97 97, 98 84, 110 84 C 122 84, 123 97, 114 100" 
        fill="#FFE833" stroke="#2B1500" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Left Eye (Big, Sparkly, Adorable) -->
  <g>
    <!-- Eyelashes -->
    <line x1="77" y1="56" x2="70" y2="44" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="52" x2="88" y2="39" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <line x1="99" y1="54" x2="105" y2="43" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyeball -->
    <circle cx="89" cy="74" r="21" fill="#FFFFFF" stroke="#2B1500" stroke-width="3.2"/>
    <!-- Iris -->
    <circle cx="94" cy="75" r="10.5" fill="url(#eye-blue)"/>
    <!-- Pupil -->
    <circle cx="95" cy="75" r="6" fill="#1A1A1A"/>
    <!-- Sparkle Highlights -->
    <circle cx="97" cy="72" r="3.2" fill="#FFFFFF"/>
    <circle cx="92" cy="77" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Right Eye (Big, Sparkly, Adorable) -->
  <g>
    <!-- Eyelashes -->
    <line x1="121" y1="54" x2="115" y2="43" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="52" x2="132" y2="39" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <line x1="143" y1="56" x2="150" y2="44" stroke="#2B1500" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyeball -->
    <circle cx="131" cy="74" r="21" fill="#FFFFFF" stroke="#2B1500" stroke-width="3.2"/>
    <!-- Iris -->
    <circle cx="126" cy="75" r="10.5" fill="url(#eye-blue)"/>
    <!-- Pupil -->
    <circle cx="125" cy="75" r="6" fill="#1A1A1A"/>
    <!-- Sparkle Highlights -->
    <circle cx="123" cy="72" r="3.2" fill="#FFFFFF"/>
    <circle cx="128" cy="77" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- FESTIVE BIRTHDAY PARTY HAT ON TOP -->
  <g transform="rotate(8 110 30)">
    <!-- Hat Cone -->
    <polygon points="110,-12 84,46 136,46" fill="url(#party-hat-grad)" stroke="#2B1500" stroke-width="3"/>
    <!-- Hat Stripes / Polka Dots -->
    <path d="M 89 36 Q 110 40 131 36" fill="none" stroke="#FFE53B" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 96 22 Q 110 25 124 22" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="110" cy="8" r="3.5" fill="#FFE53B"/>
    <!-- Fluffy Pom-Pom on top -->
    <circle cx="110" cy="-14" r="8" fill="#38BDF8" stroke="#2B1500" stroke-width="2.5"/>
    <circle cx="107" cy="-16" r="2.5" fill="#FFFFFF"/>
    <!-- Hat Trim -->
    <ellipse cx="110" cy="46" rx="27" ry="5" fill="#38BDF8" stroke="#2B1500" stroke-width="2.5"/>
  </g>
</svg>
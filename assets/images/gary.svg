<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 150" width="100%" height="100%">
  <!-- Ultra Cute Gary the Snail with Mini Birthday Party Hat -->
  <defs>
    <filter id="gary-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Eye Stalks -->
  <path d="M 54 82 Q 42 54 38 32" fill="none" stroke="#71D9F8" stroke-width="7" stroke-linecap="round"/>
  <path d="M 54 82 Q 42 54 38 32" fill="none" stroke="#2B1500" stroke-width="2.5"/>

  <path d="M 66 82 Q 64 52 62 26" fill="none" stroke="#71D9F8" stroke-width="7" stroke-linecap="round"/>
  <path d="M 66 82 Q 64 52 62 26" fill="none" stroke="#2B1500" stroke-width="2.5"/>

  <!-- Big Sparkly Eyes -->
  <circle cx="36" cy="28" r="16" fill="#FFFFFF" stroke="#2B1500" stroke-width="2.8"/>
  <circle cx="36" cy="28" r="9" fill="#F43F5E"/>
  <circle cx="36" cy="28" r="5" fill="#1A1A1A"/>
  <circle cx="38" cy="25" r="2.2" fill="#FFFFFF"/>
  <circle cx="34" cy="30" r="1.2" fill="#FFFFFF"/>

  <circle cx="62" cy="22" r="16" fill="#FFFFFF" stroke="#2B1500" stroke-width="2.8"/>
  <circle cx="62" cy="22" r="9" fill="#F43F5E"/>
  <circle cx="62" cy="22" r="5" fill="#1A1A1A"/>
  <circle cx="64" cy="19" r="2.2" fill="#FFFFFF"/>
  <circle cx="60" cy="24" r="1.2" fill="#FFFFFF"/>

  <!-- Snail Body (Cyan) -->
  <path d="M 28 118 
           C 22 102, 32 82, 64 82 
           C 85 82, 105 92, 146 108 
           C 158 113, 160 128, 146 128 
           C 96 130, 54 130, 28 128 
           C 22 128, 20 122, 28 118 Z" 
        fill="#71D9F8" stroke="#2B1500" stroke-width="2.8" filter="url(#gary-shadow)"/>

  <!-- Underbelly Wavy Slime Rim -->
  <path d="M 24 128 Q 32 133 48 128 Q 70 133 92 128 Q 118 133 150 128" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Rosy Blushing Cheek on Gary -->
  <ellipse cx="36" cy="100" rx="6" ry="4.5" fill="#FF6B8B" opacity="0.7"/>

  <!-- Cute Snail Mouth -->
  <path d="M 30 102 Q 37 107 43 100" fill="none" stroke="#2B1500" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Snail Shell (Pink with red spiral & 5 purple dots) -->
  <circle cx="108" cy="80" r="42" fill="#FF8DA1" stroke="#2B1500" stroke-width="3.2"/>
  <!-- Red Spiral -->
  <path d="M 108 80 
           A 9 9 0 0 1 101 73 
           A 18 18 0 0 1 121 66 
           A 26 26 0 0 1 129 90 
           A 34 34 0 0 1 90 108" 
        fill="none" stroke="#E11D48" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 5 Purple Spots -->
  <circle cx="82" cy="67" r="5.5" fill="#9333EA"/>
  <circle cx="101" cy="50" r="5.5" fill="#9333EA"/>
  <circle cx="129" cy="54" r="5" fill="#9333EA"/>
  <circle cx="140" cy="80" r="5.5" fill="#9333EA"/>
  <circle cx="132" cy="102" r="5" fill="#9333EA"/>

  <!-- Mini Party Hat on Gary's Shell! -->
  <g transform="translate(108, 38) rotate(15)">
    <polygon points="0,-24 -12,4 12,4" fill="#FBBF24" stroke="#2B1500" stroke-width="2"/>
    <path d="M -8 -4 Q 0 -2 8 -4" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-25" r="3.5" fill="#EC4899"/>
  </g>
</svg>
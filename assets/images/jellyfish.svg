<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="100%" height="100%">
  <!-- Jellyfish from Jellyfish Fields -->
  <defs>
    <radialGradient id="jf-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFB3D9"/>
      <stop offset="70%" stop-color="#FF4D94"/>
      <stop offset="100%" stop-color="#E60067"/>
    </radialGradient>
  </defs>

  <!-- Glowing Tentacles -->
  <path d="M 35 70 Q 25 100 35 135 Q 40 145 35 148" fill="none" stroke="#FF4D94" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 72 Q 45 105 55 140 Q 58 148 52 148" fill="none" stroke="#FF2A85" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 68 72 Q 75 105 65 140 Q 62 148 68 148" fill="none" stroke="#FF2A85" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 85 70 Q 95 100 85 135 Q 80 145 85 148" fill="none" stroke="#FF4D94" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Dome Body -->
  <path d="M 20 68 
           C 15 25, 105 25, 100 68 
           C 90 75, 80 70, 60 73 
           C 40 70, 30 75, 20 68 Z" 
        fill="url(#jf-glow)" stroke="#B3004B" stroke-width="2"/>

  <!-- Spots on Dome -->
  <ellipse cx="40" cy="45" rx="5" ry="4" fill="#B3004B" opacity="0.6"/>
  <ellipse cx="60" cy="38" rx="6" ry="5" fill="#B3004B" opacity="0.6"/>
  <ellipse cx="80" cy="46" rx="5" ry="4" fill="#B3004B" opacity="0.6"/>
  <ellipse cx="50" cy="55" rx="4" ry="3" fill="#B3004B" opacity="0.6"/>
  <ellipse cx="70" cy="55" rx="4" ry="3" fill="#B3004B" opacity="0.6"/>

  <!-- Highlights -->
  <path d="M 32 40 Q 60 28 88 40" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
</svg>
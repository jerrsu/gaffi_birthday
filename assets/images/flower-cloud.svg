<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- SpongeBob Bikini Bottom Flower Cloud -->
  <g fill="#A78BFA" opacity="0.85">
    <!-- 5 Petals -->
    <circle cx="100" cy="45" r="38"/>
    <circle cx="152" cy="82" r="38"/>
    <circle cx="132" cy="144" r="38"/>
    <circle cx="68" cy="144" r="38"/>
    <circle cx="48" cy="82" r="38"/>
    <!-- Center Hole -->
    <circle cx="100" cy="100" r="22" fill="#000000" fill-opacity="0"/>
  </g>
  <!-- Outer cutout donut effect like actual SpongeBob flowers -->
  <mask id="flower-center-hole">
    <rect width="200" height="200" fill="white"/>
    <circle cx="100" cy="100" r="22" fill="black"/>
  </mask>
</svg>